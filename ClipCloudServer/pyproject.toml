[project]
name = "ClipCloud"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aerich>=0.9.2",
    "aioboto3>=7.0.0",
    "aiobotocore>=3.3.0",
    "asyncpg>=0.31.0",
    "boto3>=1.42.70",
    "dishka>=1.9.1",
    "fastapi>=0.135.1",
    "faststream>=0.6.7",
    "ipython>=9.12.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.41.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "asyncio: mark test as asyncio"
]
pythonpath = [".", "src"]
asyncio_mode = "auto"


[tool.aerich]
tortoise_orm = "src.core.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "."
